# Accord · CI
# Installs, type-checks and builds Code_Base on every push / PR to main,
# then attaches the built dist/ to the run and publishes it to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: Code_Base

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code_Base/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: accord-dist
          path: |
            Code_Base/dist
            !Code_Base/dist/**/desktop.ini
          retention-days: 14

      - name: Prepare Pages bundle
        if: github.event_name != 'pull_request'
        run: find dist -name desktop.ini -delete

      - name: Upload Pages bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Code_Base/dist

  deploy:
    # Publishes dist/ to GitHub Pages: https://sanatharch.github.io/Accord/
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
