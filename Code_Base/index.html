<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accord</title>
  <meta name="description" content="Accord: a design intelligence configurator for residential developers, by OuTSDe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    /* Opened by double-click (file://)? This file is the development entry and cannot run
       that way; go to the built app in dist/ instead. The built copy has no src/main
       script tag, so this never fires inside dist/ or on the dev server. */
    if (location.protocol === 'file:' && document.querySelector('script[src*="src/main"]')) {
      location.replace('dist/index.html' + location.search + location.hash);
    }
  </script>
</body>
</html>
