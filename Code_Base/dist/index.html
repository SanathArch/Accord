Indian and imported materials, selected for character.","Artisan and small-batch finishes where they carry the room.","Furniture and objects with documented origin."]},ATELIER:{id:"ATELIER",name:"Atelier",rateLow:8700,rateHigh:12400,rate:10400,headline:"Commissioned · Named · Precise",lines:["Bespoke material selection, specified for this residence alone.","Named craftspeople and ateliers for the pieces that matter.","Full design development: drawings, mock-ups, site supervision."]},BESPOKE:{id:"BESPOKE",name:"Bespoke",rateLow:null,rateHigh:null,rate:null,headline:"No catalogue. Everything made.",lines:["Not a budget tier. A brief.","Every material researched, every object commissioned.","The process begins with a conversation, not a price."]}},op=["COMPOSED","PROVENANCE","ATELIER"],ip=[{label:"01 · Space and time",text:"A Sunday with no plans opens in front of you. The house is quiet. What does the next hour look like?",opts:[{img:"p-q1_opt1",text:"You notice something that has been bothering you: a chair in the wrong position, a corner that never quite worked. You fix it. The hour disappears.",scores:{HOST:3,SEEKER:1,SETTLER:0}},{img:"p-q1_opt2",text:"Something catches your attention: a book half-read, an object you have not really looked at in months. You pick it up and follow where it leads.",scores:{HOST:0,SEEKER:3,SETTLER:1}},{img:"p-q1_opt3",text:"Nothing in particular. You find somewhere comfortable and let the time pass without keeping track of it.",scores:{HOST:0,SEEKER:1,SETTLER:3}}]},{label:"02 · The object",text:"You are in someone else’s home for the first time. What do you remember when you leave?",opts:[{img:"p-q2_opt1",text:"The way it was put together: the proportions, the decisions behind it, whether it was considered or accidental.",scores:{HOST:3,SEEKER:1,SETTLER:0}},{img:"p-q2_opt2",text:"One specific thing in it. Where it might have come from. What it meant to the person who kept it.",scores:{HOST:0,SEEKER:3,SETTLER:1}},{img:"p-q2_opt3",text:"How it felt to be in. Whether you could have stayed longer. Whether the light was right.",scores:{HOST:1,SEEKER:0,SETTLER:3}}]},{label:"03 · Arrival",text:"You come home after a long trip. The flat is exactly as you left it. What do you do first?",opts:[{img:"p-q3_opt1",text:"Walk through it slowly. Notice what works and what you would change now that you have been away from it.",scores:{HOST:3,SEEKER:1,SETTLER:0}},{img:"p-q3_opt2",text:"Go to the thing that always makes it feel like yours: a lamp, a shelf, a particular corner.",scores:{HOST:0,SEEKER:3,SETTLER:1}},{img:"p-q3_opt3",text:"Put your bag down. Exhale. You are back, and that is enough.",scores:{HOST:0,SEEKER:0,SETTLER:3}}]},{label:"04 · The difficult room",text:"A room you have been in felt wrong, immediately and unmistakably. What was the problem, usually?",opts:[{img:"p-q4_opt1",text:"The space itself. Scale, proportion, the way the furniture was placed. The room had no internal logic.",scores:{HOST:3,SEEKER:0,SETTLER:1}},{img:"p-q4_opt2",text:"Nothing to look at. Nowhere for the eye to go. Everything neutralised in a way that felt like absence.",scores:{HOST:1,SEEKER:3,SETTLER:0}},{img:"p-q4_opt3",text:"It did not feel lived in. Kept rather than used. Too finished, not enough life in it.",scores:{HOST:0,SEEKER:1,SETTLER:3}}]},{label:"05 · The photograph",text:"Someone photographs your home, not for you, for a record you will not keep. What matters about how it looks?",opts:[{img:"p-q5_opt1",text:"That the space reads clearly. The logic of it comes through. The relationship between things is visible.",scores:{HOST:3,SEEKER:1,SETTLER:0}},{img:"p-q5_opt2",text:"That the specific things in it are visible, and that each one was clearly chosen with intention.",scores:{HOST:1,SEEKER:3,SETTLER:0}},{img:"p-q5_opt3",text:"That it looks inhabited. Not a set, not curated. Recognisably someone’s home.",scores:{HOST:0,SEEKER:0,SETTLER:3}}]}],sp=[{axis:"warmth",label:"Visual 01 of 05",text:"You walk into a room for the first time. Which one keeps you there?",a:{img:"warm-a",caption:"Pale, even, quiet"},b:{img:"warm-b",caption:"Wood, lamplight, shadow"}},{axis:"density",label:"Visual 02 of 05",text:"A room you admire. What do you notice first?",a:{img:"dens-a",caption:"What is not there"},b:{img:"dens-b",caption:"How much is in it"}},{axis:"indiaRoot",label:"Visual 03 of 05",text:"Which of these rooms could only belong to one place?",a:{img:"root-a",caption:"Could be anywhere"},b:{img:"root-b",caption:"Could only be here"}},{axis:"formality",label:"Visual 04 of 05",text:"At the end of a long day, how should the room receive you?",a:{img:"form-a",caption:"Everything in its place"},b:{img:"form-b",caption:"It adjusts to you"}},{axis:"objectDom",label:"Visual 05 of 05",text:"Someone leaves your home. What do they describe to a friend?",a:{img:"obj-a",caption:"The space itself"},b:{img:"obj-b",caption:"Something in it"}}],lp={"seeker-p01":{id:"seeker-p01",persona:"SEEKER",name:"White Walls & Wandering Objects",short:"White Walls",status:"ready",family:"Style 01",line:"Pale plaster and travertine that exist to hold what is placed against them.",body:"Architecture is restrained almost to neutrality. Oak, travertine and lime plaster set a warm ground; the objects, the art and the view do the rest of the work.",colors:["#EFE6D8","#C9A882","#8C6A4A","#2E2A26","#3E4A38"],colorNames:["Lime plaster","Travertine","Burnt sienna","Walnut shadow","Deep olive"],axes:{warmth:5,density:4,indiaRoot:3,formality:4,objectDom:8},complexityBudget:13,hero:"rooms/living-03.jpg",voice:{HOST:"You composed the canvas before you placed anything on it. Sightlines, negative space, the distance between things.",SEEKER:"The wall exists only to hold what is placed against it. Each object earned its position.",SETTLER:"The walls were pale when you arrived. Everything since has simply been kept, not curated."}},"host-p02":{id:"host-p02",persona:"HOST",name:"Tobacco & Dusk",short:"Tobacco & Dusk",status:"ready",family:"Style 02",line:"Walnut floor to ceiling. The joinery is the ornament. Amber light pools, never floods.",body:"Olive lacquer, burl walnut, oxblood and brass. Rooms that read as one continuous object, at their best after sundown.",colors:["#3D2B1F","#F0E8D8","#C47A3A","#6B6B3A","#1C1008"],colorNames:["Deep walnut","Warm ivory","Burnt amber","Olive lacquer","Dark chocolate"],axes:{warmth:7,density:5,indiaRoot:2,formality:8,objectDom:3},complexityBudget:17,hero:"preset/living.jpg",voice:{HOST:"Every panel was specified. The amber pooling is deliberate: not incidental warmth, placed warmth.",SEEKER:"You found the wood-lined room and added the one piece that has no business being there.",SETTLER:"Your father’s study looked like this. You reproduced a feeling without meaning to."}},"settler-p02":{id:"settler-p02",persona:"SETTLER",name:"Teak & Monsoon",short:"Teak & Monsoon",status:"direction",family:"Style 03",line:"Oxide floors, lime walls, teak joinery, cane, and plants that are alive because someone waters them.",body:"A South Asian domestic language held to a luxury standard: deep verandah shade, cross-ventilated rooms, teak that darkens over decades.",colors:["#F0EDE0","#4A2A10","#C03820","#C8A870","#1A1008"],colorNames:["Lime white","Dark teak","Oxide red","Natural cane","Shadow brown"],axes:{warmth:7,density:5,indiaRoot:8,formality:3,objectDom:4},complexityBudget:15,hero:"quiz/style-03.jpg",voice:{HOST:"You designed this from memory and built the nostalgia deliberately. The teak joinery is bespoke.",SEEKER:"You kept looking for this particular quiet after you left the country where you first found it.",SETTLER:"The oxide floor is just the floor. The teak table is where the family eats."}},"host-p01":{id:"host-p01",persona:"HOST",name:"Stone & Shadow",status:"roadmap",axes:{warmth:3,density:2,indiaRoot:1,formality:8,objectDom:2},colors:["#B0A898","#E8E0D0","#4A5240","#8C8C8C","#2A2A28"]},"host-p03":{id:"host-p03",persona:"HOST",name:"Noir & Amber",status:"roadmap",axes:{warmth:8,density:6,indiaRoot:5,formality:9,objectDom:4},colors:["#1A1510","#C45C3A","#D4880A","#6B4A2A","#0A0A08"]},"seeker-p02":{id:"seeker-p02",persona:"SEEKER",name:"Grey Plaster & Living Art",status:"roadmap",axes:{warmth:4,density:7,indiaRoot:7,formality:3,objectDom:9},colors:["#A8A8A0","#1A1A18","#2855A0","#B88040","#141412"]},"seeker-p03":{id:"seeker-p03",persona:"SEEKER",name:"Grand & Indian",status:"roadmap",axes:{warmth:9,density:9,indiaRoot:9,formality:7,objectDom:10},colors:["#F0E8D0","#8C1A1A","#C8A028","#C8A028","#0A0A14"]},"settler-p01":{id:"settler-p01",persona:"SETTLER",name:"Mud & Linen",status:"roadmap",axes:{warmth:6,density:5,indiaRoot:4,formality:3,objectDom:5},colors:["#C8A878","#E0D4B8","#8B4A2A","#B08040","#3A2A18"]},"settler-p03":{id:"settler-p03",persona:"SETTLER",name:"Dusk & Gather",status:"roadmap",axes:{warmth:7,density:6,indiaRoot:5,formality:3,objectDom:5},colors:["#3A3A38","#E0D4B8","#C89020","#D07828","#1A1A18"]}},up={HOST:{line:"You design the room before you live in it. Architecture is deliberate. Every decision is a position.",sub:"The room speaks before you do."},SEEKER:{line:"Your home is a private museum. Every object has a reason to be there, and the room reveals itself slowly.",sub:"Nothing accidental. Everything earned."},SETTLER:{line:"Comfort is not a compromise. Your home needs no explanation, it simply fits. Things find their way in.",sub:"Collected slowly. Nothing new. Everything home."}},cp={"seeker-p01":{"Living Room":[{img:"rooms/living-01.jpg",attrs:{wall:"oak",light:"lamps",seating:"classic",rug:"jute"}},{img:"rooms/living-02.jpg",attrs:{wall:"fluted",light:"lamps",seating:"modular",rug:"shag"}},{img:"rooms/living-03.jpg",attrs:{wall:"fluted",light:"ring",seating:"modular",rug:"shag"}},{img:"rooms/living-04.jpg",attrs:{wall:"marble",light:"bead",seating:"curved",rug:"emerald"}},{img:"rooms/living-05.jpg",attrs:{wall:"marble",light:"bead",seating:"modular",rug:"shag"}}],Dining:[{img:"rooms/dining-01.jpg",a OVENANCE",d:0,attr:"light",value:"ring",warmth:2,texture:2,pattern:2,lead:12,lock:"three_months",swatch:"#1E1E1E",lump:52e4,note:"A single 1.6 m ring with opal globes. Reads as architecture at night, disappears by day."},{id:"l-bead",name:"Bead Chandelier, Brass or Nickel",brand:"Commission via OuTSDe",tier:"ATELIER",d:0,attr:"light",value:"bead",warmth:3,texture:2,pattern:3,lead:18,lock:"three_months",swatch:"#B9924F",lump:145e4,note:"Hand-assembled bead arcs. Made to the ceiling drop of this residence, not to a catalogue length."}],seating:[{id:"s-classic",name:"Classic Bouclé Three-Seater",brand:"Gulmohar Lane / Ethnicraft",tier:"COMPOSED",d:0,attr:"seating",value:"classic",warmth:2,texture:2,pattern:1,lead:10,lock:"three_months",swatch:"#EDE4D6",lump:64e4,note:"One long sofa, two lounge chairs, one ottoman. The arrangement most residences settle into anyway."},{id:"s-modular",name:"Modular Bouclé System",brand:"Poliform / Bombay Atelier",tier:"PROVENANCE",d:0,attr:"seating",value:"modular",warmth:2,texture:2,pattern:1,lead:14,lock:"three_months",swatch:"#E5DACA",lump:132e4,note:"Five modules that can be re-composed after handover. Deep seat, low back, built for the view."},{id:"s-curved",name:"Curved Sculptural Sofa",brand:"Commission / Phantom Hands",tier:"ATELIER",d:0,attr:"seating",value:"curved",warmth:2,texture:2,pattern:2,lead:18,lock:"three_months",swatch:"#DCD2C2",lump:245e4,note:"A single curved piece drawn to the arc of the balcony line. Upholstered to order."}],textiles:[{id:"r-jute",name:"Jute Loop Rug, Undyed",brand:"Jaipur Rugs",tier:"COMPOSED",d:0,attr:"rug",value:"jute",warmth:3,texture:3,pattern:1,lead:8,lock:"six_weeks",swatch:"#C9B18A",lump:95e3,note:"Heavy hand-looped jute. Takes salt air and bare feet better than wool."},{id:"r-shag",name:"Monochrome Shag, Hand-Tufted",brand:"Obeetee, Mirzapur",tier:"PROVENANCE",d:0,attr:"rug",value:"shag",warmth:2,texture:3,pattern:3,lead:12,lock:"six_weeks",swatch:"#4A4643",lump:31e4,note:"Cream and charcoal graphic field. The strongest pattern decision available in this palette."},{id:"r-emerald",name:"Emerald Wool, Hand-Knotted",brand:"Obeetee custom",tier:"ATELIER",d:0,attr:"rug",value:"emerald",warmth:2,texture:2,pattern:1,lead:20,lock:"six_weeks",swatch:"#3E5140",lump:78e4,note:"Solid deep green, knotted to size. Grounds the room and answers the view."}],flooring:[{id:"f-trav",name:"Classico Travertine, Honed",brand:"Bhandari Marble",tier:"COMPOSED",d:0,warmth:3,texture:2,pattern:2,lead:10,lock:"booking",swatch:"#D8C7AC",note:"900 × 900 vein-cut, filled and honed. The floor the whole palette is built on."},{id:"f-trav-l",name:"Travertine, Large Format Slab",brand:"Antolini",tier:"PROVENANCE",d:260,warmth:3,texture:1,pattern:2,lead:14,lock:"booking",swatch:"#E0D0B6",note:"1200 × 2400 slabs, fewer joints, book-matched at the thresholds."}]},Dining:{wall:[{id:"dw-plaster",name:"Lime Plaster, Warm White",brand:"Pandomo (Ardex)",tier:"COMPOSED",d:0,attr:"wall",value:"plaster",warmth:2,texture:2,pattern:1,lead:8,lock:"booking",swatch:"#EDE3D2",note:"Flat hand-applied plaster. Lets the table and the pendant carry the room."},{id:"dw-timber",name:"Walnut Ribbed Wall + Bar",brand:"Bengaluru joinery",tier:"PROVENANCE",d:340,attr:"wall",value:"walnut",warmth:3,texture:3,pattern:2,lead:12,lock:"booking",swatch:"#6B4526",note:"Ribbed walnut with an integrated bar and glass store behind."},{id:"dw-stone",name:"Vein-Cut Travertine Wall",brand:"RMS Stonex",tier:"ATELIER",d:480,attr:"wall",value:"stone",warmth:3,texture:2,pattern:2,lead:16,lock:"booking",swatch:"#D9C4A3",note:"The floor material turned vertical and vein-matched across four slabs."}],lighting:[{id:"dl-linear",name:"Linear Opal Pendant",brand:"Astro / Klove",tier:"COMPOSED",d:0,lump:24e4,attr:"light",value:"linear",warmth:3,texture:1,pattern:1,lead:8,lock:"three_months",swatch:"#F0E7D2",note:"One horizontal fixture at 750 mm above the table. Diffused, no glare across the glass."},{id:"dl-paper",name:"Pleated Shade Cluster",brand:"Sogani / commission",tier:"PROVENANCE",d:0,lump:46e4,attr:"light",value:"cluster",warmth:3,texture:2,pattern:2,lead:14,lock:"three_months",swatch:"#E2D2AE",note:"Three pleated shades on separate drops, staggered along the table length."},{id:"dl-globe",name:"Opal Globe Row on Brass Rail",brand:"Klove Studio",tier:"ATELIER",d:0,lump:82e4,attr:"light",value:"globe",warmth:3,texture:1,pattern:2,lead:18,lock:"three_months",swatch:"#F0E7D2",note:"Five hand-blown globes on one brass rail, dimmed to candle level for dinner."}],seating:[{id:"ds-black",name:"Blackened Oak Dining Chairs",brand:"Phantom Hands",tier:"PROVENANCE",d:0,lump:52e4,warmth:2,texture:2,pattern:1,lead:12,lock:"three_months",swatch:"#2A2320",note:"Eight chairs, blackened oak frame, bouclé seat. Made in Bengaluru."},{id:"ds-cane",name:"Cane and Teak Dining Chairs",brand:"Phantom Hands",tier:"COMPOSED",d:0,lump:34e4,warmth:3,texture:3,pattern:2,lead:10,lock:"three_months",swatch:"#C29A63",note:"Woven cane over teak. Lighter in the room and in the hand."}]},Kitchen:{cabinetry:[{id:"kc-bone",name:"Matt Lacquer, Bone",brand:"Häcker / Sleek",tier:"COMPOSED",d:0,lump:125e4,attr:"cab",value:"bone",warmth:2,texture:1,pattern:1,lead:12,lock:"booking",swatch:"#E8E1D3",note:"Handleless bone lacquer, Blum soft-close, Hettich internals."},{id:"kc-oak",name:"Oak Veneer, Routed Pull",brand:"Greenlam / joinery",tier:"PROVENANCE",d:0,lump:185e4,attr:"cab",value:"oak",warmth:3,texture:2,pattern:2,lead:14,lock:"booking",swatch:"#C39A6B",note:"Rift-sawn oak with a routed finger pull, no hardware on the face."},{id:"kc-brass",name:"Brushed Brass over Oak",brand:"Commission",tier:"ATELIER",d:0,lump:32e5,attr:"cab",value:"brass",warmth:3,texture:2,pattern:2,lead:20,lock:"booking",swatch:"#A8823F",note:"Brass-faced uppers over oak bases. Patinates. Expect it to look better in year three."}],wall:[{id:"kw-stone",name:"Stone Splashback, Full Height",brand:"Classic Marble",tier:"PROVENANCE",d:0,attr:"splash",value: "Seating",textiles:"Textiles",flooring:"Floor",cabinetry:"Cabinetry"},fp={booking:{id:"booking",label:"At booking",sub:"Long-lead surfaces, kitchen, sanitaryware and electrical go to procurement."},three_months:{id:"three_months",label:"3 months to possession",sub:"Lighting, wardrobes and furniture confirmed and ordered."},six_weeks:{id:"six_weeks",label:"6 weeks to possession",sub:"Statement lighting, soft furnishings, artwork and styling."}},pp={"seeker-p01":"white-walls","host-p02":"tobacco-dusk","settler-p02":"teak-monsoon"},mp={"Living Room":"living",Dining:"dining",Kitchen:"kitchen","Master Bedroom":"master"},gp={"Living Room":["wall","light"],Dining:["wall","light"],Kitchen:["cab","splash"],"Master Bedroom":["wall","light"]},wp={"seeker-p01":[{img:"rooms/living-03.jpg",title:"Living Room",note:"Fluted plaster, ring pendant, late afternoon.",pending:!0},{img:"rooms/dining-01.jpg",title:"Dining",note:"Travertine table for eight, pleated shade.",pending:!0},{img:"rooms/kitchen-01.jpg",title:"Kitchen",note:"Bone lacquer, brass uppers, stone splashback.",pending:!0},{img:"rooms/bedroom-01.jpg",title:"Master Bedroom",note:"Oak headboard wall, jute, the view at the foot of the bed.",pending:!0}],"host-p02":[],"settler-p02":[{img:"quiz/style-03.jpg",title:"Direction",note:"Material direction. Render set in production.",pending:!0}]},vp=["phantom-hands","jaipur-rugs","klove-studio","bharat-floorings","classic-marble-company","gaggenau","axor-hansgrohe","obeetee","gallery-sumukha","maya-organic"],yp={brands:[{id:"classic-marble-company",name:"Classic Marble Company",category:"stone",subcategory:"imported marble and engineered stone slabs",origin:"Maharashtra",founded:"1995",india_presence:"own_showroom",india_contact:"Classic Marble Company, Bhandup West, Mumbai, with dealer network across South India",register:["PROVENANCE"],palettes:["white-walls","tobacco-dusk"],signature:"One of India's largest importers and processors of Italian marble, plus the KalingaStone engineered surface line, cut and finished in-house at Silvassa",why:"For the Nero Marquina bands and the dark stone in Tobacco and Dusk you want slabs from one block, selected and reserved before cutting. Classic Marble holds inventory in India, so you see the actual slab rather than a photograph.",lead_weeks:10,price_band:"₹450 to ₹2,200 per sq ft depending on stone, ex-Mumbai",url:"https://classicmarble.com/",verified:!0,source:"https://classicmarble.com/about/",regions:["IN"]},{id:"rms-stonex",name:"RMS Stonex",category:"stone",subcategory:"travertine and imported Italian marble",origin:"Rajasthan",founded:"1978",india_presence:"own_showroom",india_contact:"RMS Stonex, Marble Industrial Area, Kishangarh, Rajasthan",register:["PROVENANCE"],palettes:["white-walls"],signature:"Kishangarh trader and processor holding large travertine and exotic imported marble stock, including textured and vein-cut travertine",why:"Honed travertine is the spine of White Walls and Wandering Objects. Kishangarh is where the container lands, and buying at the yard means matching a full apartment from one lot.",lead_weeks:8,price_band:"₹180 to ₹600 per sq ft for travertine, ex-Kishangarh",url:"https://rmsstonex.in/",verified:!0,source:"https://www.rmsstonex.com/travertine-marble.html",regions:["IN"]},{id:"antolini",name:"Antolini",category:"stone",subcategory:"exotic and precious natural stone",origin:"Italy",founded:"1955",india_presence:"import_only",india_contact:"No exclusive Indian distributor confirmed; slabs reach India through Mumbai and Kishangarh stone importers",register:["PROVENANCE","ATELIER"],palettes:["white-walls","tobacco-dusk"],signature:"Verona house known for Precioustone and Haute Nature collections, and for selling stone by the named block",why:"Reserved for a single hero surface, an island or a bath surround, where the buyer is choosing a specific block rather than a material.",lead_weeks:20,price_band:"Top band; quoted per block on application",url:"https://www.antolini.com/",verified:!1,source:"https://www.antolini.com/en/natural-stones/marble",regions:["IN"]},{id:"quantra-pokarna",name:"Quantra by Pokarna",category:"stone",subcategory:"engineered quartz surfaces",origin:"Telangana",founded:"1991",india_presence:"own_showroom",india_contact:"Pokarna Engineered Stone, Hyderabad, with fabricator network in Bengaluru",register:["COMPOSED"],palettes:["white-walls","tobacco-dusk"],signature:"Indian-made Bretonstone quartz manufactured at Vishakhapatnam and Mekaguda, exported to the US and Europe under the Quantra name",why:"The honest Composed answer for kitchen and utility worktops in a coastal building: no sealing routine, no etching from a squeezed lime, and a warranty serviced from within India.",lead_weeks:5,price_band:"₹350 to ₹900 per sq ft",url:"https://quantra.in/",verified:!0,source:"https://quantra.in/about-us/",regions:["IN"]},{id:"bharat-floorings",name:"Bharat Floorings and Tiles",category:"stone",subcategory:"terrazzo and handmade cement tiles",origin:"Maharashtra",founded:"1922",india_presence:"own_showroom",india_contact:"Bharat Floorings and Tiles, Mumbai, project supply pan-India",register:["COMPOSED","PROVENANCE"],palettes:["white-walls","tobacco-dusk"],signature:"India's oldest tile house, floors laid in Bombay House and the Taj, still making in-situ terrazzo and hand-pressed cement tiles to drawing",why:"Terrazzo you can specify by aggregate and matrix colour, made by a firm with a hundred years of laying it. Burnt sienna chips in a warm white matrix is a made-to-order conversation, not a catalogue pick.",lead_weeks:8,price_band:"₹200 to ₹650 per sq ft depending on pattern and aggregate",url:"https://www.bharatfloorings.com/",verified:!0,source:"https://www.bharatfloorings.com/about/our-company",regions:["IN"]},{id:"vp-chettinad-athangudi",name:"VP Chettinad Athangudi Tiles",category:"stone",subcategory:"handmade Athangudi floor tiles",origin:"Tamil Nadu",founded:null,india_presence:"direct_maker",india_contact:"Athangudi, Sivaganga district, Tamil Nadu",register:["PROVENANCE","ATELIER"],palettes:["white-walls"],signature:"Athangudi tiles poured by hand on glass plates with local sand and oxide pigments, cured not fired, each one slightly different in tone",why:"A South Indian floor with a real address, twelve hours by road from Mangaluru. Works as an inset or a single room floor where a fully machine-made scheme would go flat.",lead_weeks:7,price_band:"₹90 to ₹220 per sq ft ex-works, pattern dependent",url:"https://vpchettinadtiles.com/",verified:!0,source:"https://vpchettinadtiles.com/",regions:["IN"]},{id:"orvi",name:"Orvi Surfaces",category:"stone",subcategory:"handcrafted stone inlay and decorative surface panels",origin:"Rajasthan",founded:"2006",india_presence:"own_showroom",india_contact:"Orvi, Jaipur, with project supply and a US arm",register:["PROVENANCE","ATELIER"],palettes:["white-walls","tobacco-dusk"],signature:"Jaipur workshop combining stone inlay, mother of pearl, metal and ceramic into architectural wall panels, sold internationally as a surface brand",why:"Where Atelier buyers want one wall that is unmistakably commissioned. Inlay in Nero Marquina with brass line work sits directly in the Tobacco and Dusk register.",lead_weeks:14,price_band:"Upper band; quoted per panel, typically five figures per sq ft for inlay work",url:"https://orvi.com/",verified:!0,source:"https://orvi.com/pages/press",regions:["IN"]},{id:"kajaria-eternity",name:"Kajaria Eternity",category:"stone",subcategory:"large format glazed vitrified tiles and porcelain slabs",origin:"Haryana",founded:"1985",india_presence:"own_showroom",india_contact:"Kajaria Eternity World showrooms, dealer network in Mangaluru and Bengaluru",register:["COMPOSED"],palettes:["white-walls","tobacco-dusk"],signature:"India's largest tile maker's premium arm, now doing 1200 x 1800 mm UniTerra slabs in stone-look finishes",why:"The Composed register needs a tile that reads as stone at arm's length and is serviceable in 296 flats. Kajaria has the format, the consistency across batches and a replacement route in Mangaluru.",lead_weeks:4,price_band:"₹90 to ₹350 per sq ft",url:"https://www.kajariaeternity.com/",verified:!0,source:"https://www.kajariaceramics.com/news-detail.php?blog_id=922",regions:["IN"]},{id:"reb-industries",name:"REB Industries",category:"stone",subcategory:"handmade clay zellige and thin brick tiles",origin:"Karnataka",founded:null,india_presence:"direct_maker",india_contact:"REB Industries Pvt Ltd, Malur, Kolar district, Karnataka",register:["PROVENANCE"],palettes:["white-walls","tobacco-dusk"],signature:"Karnataka clay works pressing handmade zellige-format tiles, clay jaali and thin brick facing tiles",why:"Handmade glazed tile from four hours away rather than from Fez. The variation in a zellige backsplash is the point, and a site visit to the kiln is a day trip.",lead_weeks:6,price_band:"From about ₹250 per sq ft for zellige, listed trade price",url:"https://www.brickfacade.in/",verified:!0,source:"https://www.indiamart.com/proddetail/zellige-tiles-2854385863062.html",regions:["IN"]},{id:"nilaya-arc",name:"Nilaya Arc by Asian Paints",category:"surface",subcategory:"lime-based interior paint and plaster finishes",origin:"Maharashtra",founded:"1942",india_presence:"own_showroom",india_contact:"Asian Paints Beautiful Homes stores, Mangaluru and Bengaluru; DecorPro applicator network",register:["COMPOSED"],palettes:["white-walls","tobacco-dusk"],signature:"A genuinely lime-based interior range, Arc Matt and Arc Pearlescent, with a trained applicator network rather than a bag of powder",why:"Warm white lime plaster over 296 flats needs an applicator system, not a specialist artisan per room. This is the Composed route to the look with a colour card and a warranty.",lead_weeks:3,price_band:"Applied cost roughly ₹120 to ₹250 per sq ft including labour",url:"https://www.asianpaints.com/paint-products/interior-wall-paints/nilaya-arc.html",verified:!0,source:"https://www.asianpaints.com/paint-products/interior-wall-paints/nilaya-arc.html",regions:["IN"]},{id:"cementolime",name:"Cementolime Sustainable Coatings",category:"surface",subcategory:"lime plaster, tadelakt and araish",origin:"Uttar Pradesh",founded:null,india_presence:"direct_maker",india_contact:"Cementolime, Kanpur, supplies material and applicators pan-India",register:["PROVENANCE"],palettes:["white-walls"],signature:"Indian maker of true lime tadelakt and araish plasters, sold as a material with application, not as an emulsion",why:"For the Provenance register where the buyer wants the burnished, slightly cloudy depth of real lime on a bath wall. It takes water, which is the whole argument for tadelakt over paint.",lead_weeks:5,price_band:"From about ₹200 per sq ft, listed trade price, material and application",url:"https://www.indiamart.com/cementolime-sustainable-coatings/lime-plaster.html",verified:!0,source:"https://www.indiamart.com/proddetail/lime-tadelakt-araish-plaster-2854863675588.html",regions:["IN"]},{id:"microtopping-india",name:"Microtopping India",category:"surface",subcategory:"microcement floors, walls and wet rooms",origin:"Karnataka",founded:null,india_presence:"distributor",india_contact:"Microtopping India, applicator operations listed for Bengaluru, Mangaluru, Mysuru and Goa",register:["COMPOSED","PROVENANCE"],palettes:["white-walls","tobacco-dusk"],signature:"Applicator and distributor for Ideal Work Microtopping, a 3 mm seamless cementitious skin over existing screed",why:"The only sensible way to get a jointless floor in a tower where you cannot add screed depth. They already work the coastal Karnataka corridor, which matters for warranty call-backs.",lead_weeks:4,price_band:"₹350 to ₹700 per sq ft applied",url:"https://microtopping.co.in/",verified:!0,source:"https://microtopping.co.in/about.html",regions:["IN"]},{id:"greenlam-decowood",name:"Greenlam Decowood Veneers",category:"surface",subcategory:"natural and reconstituted wood v
